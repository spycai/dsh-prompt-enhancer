name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the plugin has no runtime dependencies. schemastery is
      # an optional peer, so on CI it will not resolve and the schema tests skip.

      - name: Syntax check every source file
        run: |
          node --check index.js
          node --check client.js
          for f in lib/*.js; do node --check "$f"; done

      - name: Unit and integration tests
        run: npm test

      # The prompt-quality gate. `npm test` already asserts the evaluator
      # reproduces the reference numbers exactly; this step additionally prints
      # the scorecard into the log and fails on any regression against the
      # recorded baseline, so a prompt edit cannot quietly lower quality.
      - name: Prompt quality against the recorded baseline
        run: npm run baseline:check

      - name: Schema resolution is reported, never fatal
        run: |
          node -e "
          import('./index.js').then((m) => {
            console.log('Config exported:', m.Config !== undefined)
            if (typeof m.apply !== 'function') process.exit(1)
          }).catch((error) => { console.error(error); process.exit(1) })
          "
