name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every source file
        working-directory: 源文件
        run: |
          node --check index.js
          node --check client.js
          node --check lib/prompt.js

      - name: Unit and integration tests
        working-directory: 源文件
        run: npm test

      # The Config schema is optional: on a machine without the schemastery
      # junction the export is undefined and the plugin still works. The suite
      # therefore asserts schema behaviour only when the package resolves.
      - name: Schema resolution is reported, never fatal
        working-directory: 源文件
        run: |
          node -e "
          import('./index.js').then((m) => {
            console.log('Config exported:', m.Config !== undefined)
            if (typeof m.apply !== 'function') process.exit(1)
          }).catch((error) => { console.error(error); process.exit(1) })
          "
