name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the plugin has no runtime dependencies. schemastery is
      # an optional peer, so on CI it will not resolve and the schema tests skip.

      - name: Syntax check every source file
        run: |
          node --check index.js
          node --check client.js
          node --check lib/prompt.js

      - name: Unit and integration tests
        run: npm test

      - name: Schema resolution is reported, never fatal
        run: |
          node -e "
          import('./index.js').then((m) => {
            console.log('Config exported:', m.Config !== undefined)
            if (typeof m.apply !== 'function') process.exit(1)
          }).catch((error) => { console.error(error); process.exit(1) })
          "
